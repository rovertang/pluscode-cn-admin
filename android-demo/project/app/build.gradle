plugins { id 'com.android.application' }
def repositoryRoot = rootProject.projectDir.parentFile.parentFile
def databaseFile = new File(repositoryRoot, 'data/processed/v2/pluscode_admin_v2.sqlite')
def generatedDatabaseAssets = layout.buildDirectory.dir('generated/databaseAssets')
def prepareDatabaseAsset = tasks.register('prepareDatabaseAsset', Copy) {
    from databaseFile
    into generatedDatabaseAssets
    inputs.file databaseFile
}
android {
    namespace 'com.askcodex.pluscodedemo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.askcodex.pluscodedemo'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.askcodex.pluscodedemo.DemoInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources { noCompress 'sqlite' }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
    sourceSets {
        main {
            assets.srcDir generatedDatabaseAssets
            jniLibs.srcDirs = [new File(repositoryRoot, 'sdk/android/jniLibs')]
        }
    }
}
tasks.named('preBuild').configure { dependsOn prepareDatabaseAsset }
dependencies { implementation files(new File(repositoryRoot, 'sdk/java/pluscode-admin-1.0.0.jar')) }
